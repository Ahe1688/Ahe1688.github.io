name: 每日更新直播源

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00 自动更新一次
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点 “Run workflow” 立即更新

permissions:
  contents: write        # 允许把新生成的 channels.json / live.m3u8 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 channels.json
        run: python3 generate_channels.py channels.json

      - name: 剔除失效源（保守策略：只删 404/5xx/DNS失败/连接拒绝/重置/SSL错误/HTML错误页）
        run: python3 filter_sources.py channels.json channels.json --workers 80 --timeout 7

      - name: 同步导出 M3U8 播放列表（与 channels.json 内容一致）
        run: python3 export_m3u8.py channels.json live.m3u8

      - name: 提交（仅在有变化时）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json live.m3u8
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动更新直播源 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
